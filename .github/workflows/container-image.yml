# Build the Orca agent image on GitHub-hosted amd64 runners and publish to GHCR.
#
# Why GitHub builds it: the Orca AppImage is x86_64-only, so an arm64 Mac cannot
# run the image locally (and QEMU emulation is too slow to be useful). GHCR is
# the source of truth; Cloudflare's managed registry is filled from GHCR by
# scripts/promote-image.sh because `durable_object` scheduling cannot pull
# external registries directly.
name: container-image

on:
  push:
    branches: [master, on-demand-wake]
    paths:
      - 'container/**'
      - '.github/workflows/container-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Cloudflare's managed registry rejects attestation blobs
          # ("blob unknown to registry"). Emit a plain single-platform image.
          provenance: false
          sbom: false

      - name: Emit image digest
        # build-push-action's digest output is the pushed manifest digest.
        # steps.meta.outputs.digest is empty here (metadata-action only sets it
        # for certain bake flows), which is why the first run printed "Digest: ".
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          if [ -z "$digest" ]; then
            echo "ERROR: build-push-action produced no digest" >&2
            exit 1
          fi
          echo "Image published to GHCR (source of truth)."
          echo "Digest: $digest"
          echo "Ref:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
          echo "Next:   scripts/promote-image.sh <tag> --update-wrangler"
