# Build the Orca agent image on GitHub-hosted amd64 runners and publish to GHCR.
#
# Why GitHub builds it: the Orca AppImage is x86_64-only, so an arm64 Mac cannot
# run the image locally (and QEMU emulation is too slow to be useful). GHCR is
# the source of truth; Cloudflare's managed registry is filled from GHCR by
# scripts/promote-image.sh because `durable_object` scheduling cannot pull
# external registries directly.
name: container-image

on:
  push:
    branches: [master, on-demand-wake]
    paths:
      - 'container/**'
      - '.github/workflows/container-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit image digest
        run: |
          echo "Image published to GHCR (source of truth)."
          echo "Digest: ${{ steps.meta.outputs.digest }}"
          echo "Next: run scripts/promote-image.sh to mirror into Cloudflare's managed registry."
